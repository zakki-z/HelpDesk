security:
    password_hashers:
        App\Entity\Personnel:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Personnel
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: false

    role_hierarchy:
        ROLE_TECHNICIEN: ROLE_USER
        ROLE_RESPONSABLE: ROLE_TECHNICIEN
        ROLE_ADMIN: ROLE_RESPONSABLE

    access_control:
        # Public routes
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        # Admin-only routes
        - { path: ^/personnel, roles: ROLE_RESPONSABLE }
        - { path: ^/sla, roles: ROLE_RESPONSABLE }
        - { path: ^/stock, roles: ROLE_RESPONSABLE }
        # Technician routes
        - { path: ^/intervention, roles: ROLE_TECHNICIEN }
        # All authenticated users
        - { path: ^/equipement, roles: ROLE_USER }
        - { path: ^/ticket, roles: ROLE_USER }
        - { path: ^/, roles: ROLE_USER }
