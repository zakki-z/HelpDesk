security:
    password_hashers:
        App\Entity\Personnel:
            #option 1 : plaintext 7it kan inserew direct f base données -> donc password makahsouch ythasha w nkhdmo ghi b plaintext fl phase d dev
            #option 2 : ndiro auto w nmchiw nhashiw chi password (bycrypt)  w hia li inserwha f base données !
            algorithm: auto
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Personnel
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_login
            # remember me
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week in seconds
                path: /
                always_remember_me: false

    role_hierarchy:
        ROLE_TECHNICIEN: ROLE_USER
        ROLE_RESPONSABLE: ROLE_TECHNICIEN
        ROLE_ADMIN: ROLE_RESPONSABLE

    access_control:
        # Public routes
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }
        # Admin routes
        - { path: ^/personnel, roles: ROLE_RESPONSABLE }
        # Protected routes - tout utilisateur connecté
        - { path: ^/equipement, roles: ROLE_USER }
        - { path: ^/ticket, roles: ROLE_USER }
        - { path: ^/intervention, roles: ROLE_TECHNICIEN }
        - { path: ^/stock, roles: ROLE_RESPONSABLE }
        - { path: ^/, roles: ROLE_USER }
