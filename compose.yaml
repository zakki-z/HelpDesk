version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: oncf_helpdesk_db
    environment:
      POSTGRES_DB: helpdesk_db
      POSTGRES_USER: symfony_user
      POSTGRES_PASSWORD: symfony_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - helpdesk_network

  # Symfony PHP Application (Internal Web Server)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oncf_helpdesk_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      - database
    networks:
      - helpdesk_network

volumes:
  db_data:

networks:
  helpdesk_network:
    driver: bridge